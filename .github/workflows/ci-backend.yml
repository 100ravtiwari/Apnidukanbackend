
name: Apni Dukan Backend CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_REGION: asia-south1
  GAR_REPO: dukan-repo
  IMAGE_NAME: backend

jobs:
  build-and-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore Dependencies
        run: dotnet restore Dukan.API.csproj

      - name: Build Backend
        run: dotnet build Dukan.API.csproj --configuration Release --no-restore

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Authentication
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          FULL_IMAGE="${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}/${IMAGE_NAME}"

          docker build \
            -t "${FULL_IMAGE}:${IMAGE_TAG}" \
            -t "${FULL_IMAGE}:latest" .

          docker push "${FULL_IMAGE}:${IMAGE_TAG}"
          docker push "${FULL_IMAGE}:latest"

          echo "Published image: ${FULL_IMAGE}:${IMAGE_TAG}"

      - name: Update GitOps Repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -e

          FULL_IMAGE="${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}/${IMAGE_NAME}:${IMAGE_TAG}"

          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/100ravtiwari/apni-dukan-gitops.git gitops

          cd gitops

          sed -i "s|image: .*dukan-repo/backend:.*|image: ${FULL_IMAGE}|" base/backend/rollout.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add base/backend/rollout.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Deploy backend image ${IMAGE_TAG}"
            git push origin main
          else
            echo "No GitOps changes detected."
          fi

          echo "GitOps repository updated with ${FULL_IMAGE}"
